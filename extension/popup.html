<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      width: 340px;
      font-family: 'Segoe UI', Tahoma, Arial, sans-serif;
      background: #020617;
      color: #f1f5f9;
      padding: 16px;
    }
    .head { display: flex; align-items: center; gap: 10px; margin-bottom: 14px; }
    .head img { width: 36px; height: 36px; border-radius: 10px; }
    .head h1 { font-size: 14px; font-weight: 800; }
    .head p { font-size: 10px; color: #64748b; letter-spacing: 0.08em; text-transform: uppercase; }
    .url {
      background: #0f172a; border: 1px solid #1e293b; border-radius: 10px;
      padding: 10px 12px; font-size: 11px; word-break: break-all; direction: ltr;
      text-align: left; color: #94a3b8; margin-bottom: 12px; max-height: 48px; overflow: hidden;
    }
    button {
      width: 100%; border: none; border-radius: 12px; padding: 12px;
      font-weight: 800; font-size: 13px; cursor: pointer;
      background: linear-gradient(135deg, #2563eb, #0891b2); color: white;
    }
    button:disabled { opacity: 0.6; cursor: wait; }
    .result { margin-top: 14px; display: none; }
    .result.show { display: block; }
    .score {
      text-align: center; padding: 16px; border-radius: 14px;
      background: #0f172a; border: 1px solid #1e293b; margin-bottom: 10px;
    }
    .score .n { font-size: 32px; font-weight: 900; }
    .score .l { font-size: 12px; margin-top: 4px; font-weight: 700; }
    .safe { color: #10b981; }
    .warn { color: #f59e0b; }
    .danger { color: #ef4444; }
    .meta { font-size: 11px; color: #64748b; line-height: 1.6; }
    .meta a { color: #22d3ee; text-decoration: none; font-weight: 700; }
    .err { color: #f87171; font-size: 12px; margin-top: 10px; display: none; }
    .foot { margin-top: 12px; text-align: center; font-size: 10px; color: #475569; }
  </style>
</head>
<body>
  <div class="head">
    <img src="icons/icon48.png" alt="" />
    <div>
      <h1>SecuCode <span style="color:#22d3ee">Pro</span></h1>
      <p>Live Threat Scanner</p>
    </div>
  </div>
  <div class="url" id="pageUrl">—</div>
  <button id="scanBtn">فحص هذه الصفحة الآن</button>
  <div class="err" id="err"></div>
  <div class="result" id="result">
    <div class="score">
      <div class="n" id="scoreNum">0</div>
      <div class="l" id="scoreLabel">—</div>
    </div>
    <div class="meta" id="meta"></div>
  </div>
  <div class="foot">إعدادات الخادم من Options · طارق مصطفى · مازن عمرو</div>
  <script src="popup.js"></script>
</body>
</html>
