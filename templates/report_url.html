<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>إبلاغ عن رابط | SecuCode Pro</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700;900&display=swap" rel="stylesheet" />
  <style>
    body { font-family: 'Cairo', system-ui, sans-serif; background: #020617; color: #f1f5f9; min-height: 100vh; }
    .glass { background: rgba(15,23,42,.9); border: 1px solid rgba(148,163,184,.12); }
  </style>
</head>
<body class="p-4 md:p-10">
  <div class="max-w-lg mx-auto space-y-8">
    <a href="/" class="flex items-center gap-3">
      <img src="/static/img/logo-mark.png" class="w-10 h-10 rounded-xl" alt="" />
      <div>
        <div class="font-black">SecuCode <span class="text-cyan-400">Pro</span></div>
        <div class="text-[10px] text-slate-500 tracking-widest uppercase">Community Reports</div>
      </div>
    </a>

    <div class="glass rounded-3xl p-6 md:p-8 space-y-5">
      <div>
        <h1 class="text-2xl font-black mb-1">إبلاغ عن رابط مشبوه</h1>
        <p class="text-sm text-slate-400 leading-relaxed">ساهم في حماية المجتمع. البلاغات تُراجع من الإدارة ويمكن إضافتها للقائمة السوداء وقواعد التهديد.</p>
      </div>

      <div>
        <label class="text-[11px] font-bold text-slate-500 uppercase tracking-wider">الرابط *</label>
        <input id="url" type="url" dir="ltr" placeholder="https://suspicious-site.com"
          class="mt-1.5 w-full bg-slate-900 border border-slate-700 rounded-xl px-4 py-3 text-sm outline-none focus:border-cyan-500" />
      </div>
      <div>
        <label class="text-[11px] font-bold text-slate-500 uppercase tracking-wider">سبب البلاغ</label>
        <select id="reason" class="mt-1.5 w-full bg-slate-900 border border-slate-700 rounded-xl px-4 py-3 text-sm outline-none focus:border-cyan-500">
          <option value="phishing">تصيد احتيالي (Phishing)</option>
          <option value="malware">برمجيات خبيثة</option>
          <option value="scam">احتيال / نصب</option>
          <option value="spyware">تجسس / كاميرا</option>
          <option value="suspicious">مشبوه عام</option>
        </select>
      </div>
      <div>
        <label class="text-[11px] font-bold text-slate-500 uppercase tracking-wider">تفاصيل إضافية</label>
        <textarea id="details" rows="3" placeholder="صف ما لاحظته..."
          class="mt-1.5 w-full bg-slate-900 border border-slate-700 rounded-xl px-4 py-3 text-sm outline-none focus:border-cyan-500"></textarea>
      </div>
      <div>
        <label class="text-[11px] font-bold text-slate-500 uppercase tracking-wider">اسمك (اختياري)</label>
        <input id="reporter" type="text" placeholder="مجهول"
          class="mt-1.5 w-full bg-slate-900 border border-slate-700 rounded-xl px-4 py-3 text-sm outline-none focus:border-cyan-500" />
      </div>

      <button id="btn" onclick="submitReport()" class="w-full bg-gradient-to-l from-red-600 to-orange-600 hover:from-red-500 hover:to-orange-500 text-white font-black py-3.5 rounded-xl transition">
        إرسال البلاغ
      </button>
      <p id="msg" class="text-center text-sm font-semibold hidden"></p>
    </div>

    <div class="text-center text-xs text-slate-600 space-x-4 space-x-reverse">
      <a href="/threats" class="hover:text-cyan-400">إحصائيات التهديدات</a>
      <a href="/" class="hover:text-cyan-400">فحص رابط</a>
    </div>
  </div>

  <script>
    async function submitReport() {
      const url = document.getElementById('url').value.trim();
      const msg = document.getElementById('msg');
      const btn = document.getElementById('btn');
      msg.classList.add('hidden');
      if (!url) {
        msg.textContent = 'أدخل الرابط';
        msg.className = 'text-center text-sm font-semibold text-red-400';
        return;
      }
      btn.disabled = true;
      btn.textContent = 'جاري الإرسال...';
      try {
        const res = await fetch('/api/community/report', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            url,
            reason: document.getElementById('reason').value,
            details: document.getElementById('details').value,
            reporter: document.getElementById('reporter').value || 'anonymous'
          })
        });
        const data = await res.json();
        if (!data.success) throw new Error(data.error || 'فشل');
        msg.textContent = 'تم استلام البلاغ ✓ رقم #' + (data.id || '') + ' — قيد المراجعة';
        msg.className = 'text-center text-sm font-semibold text-emerald-400';
        document.getElementById('url').value = '';
        document.getElementById('details').value = '';
      } catch (e) {
        msg.textContent = e.message || 'خطأ في الإرسال';
        msg.className = 'text-center text-sm font-semibold text-red-400';
      } finally {
        btn.disabled = false;
        btn.textContent = 'إرسال البلاغ';
      }
    }
  </script>
</body>
</html>
