<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Admin | SecuCode Pro</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800;900&display=swap" rel="stylesheet" />
  <script src="https://unpkg.com/lucide@latest"></script>
  <style>
    body { font-family: 'Cairo', system-ui, sans-serif; background: #020617; color: #f1f5f9; min-height: 100vh; }
    .glass { background: rgba(15,23,42,0.85); backdrop-filter: blur(20px); border: 1px solid rgba(148,163,184,0.1); }
  </style>
</head>
<body class="p-4 md:p-8">
  <div class="max-w-4xl mx-auto space-y-8">
    <header class="flex items-center justify-between">
      <div class="flex items-center gap-3">
        <a href="/"><img src="/static/img/logo-mark.png" alt="SecuCode" class="w-10 h-10 rounded-xl shadow" /></a>
        <div>
          <h1 class="font-black text-xl">لوحة التحكم</h1>
          <p class="text-xs text-slate-500">SecuCode Pro Admin · طارق مصطفى · مازن عمرو</p>
        </div>
      </div>
      <a href="/" class="text-sm text-slate-400 hover:text-blue-400 font-bold">← العودة للموقع</a>
    </header>

    <!-- Auth -->
    <div id="authBox" class="glass rounded-2xl p-8 max-w-md mx-auto space-y-4">
      <h2 class="text-lg font-black text-center">تسجيل الدخول</h2>
      <p class="text-xs text-slate-500 text-center">أدخل ADMIN_TOKEN الموجود في Environment Variables</p>
      <input id="adminToken" type="password" placeholder="Admin Token" class="w-full bg-slate-900 border border-slate-700 rounded-xl px-4 py-3 text-sm" dir="ltr" />
      <button onclick="login()" class="w-full bg-blue-600 hover:bg-blue-500 text-white font-black py-3 rounded-xl transition">دخول</button>
      <p id="authError" class="hidden text-red-400 text-sm text-center"></p>
    </div>

    <!-- Dashboard (hidden until auth) -->
    <div id="dashboard" class="hidden space-y-8">
      <!-- Stats -->
      <div class="grid grid-cols-3 gap-4">
        <div class="glass rounded-2xl p-5 text-center">
          <div id="sTotal" class="text-3xl font-black text-blue-400">—</div>
          <div class="text-[10px] text-slate-500 font-bold uppercase mt-1">إجمالي الفحوصات</div>
        </div>
        <div class="glass rounded-2xl p-5 text-center">
          <div id="sThreats" class="text-3xl font-black text-red-400">—</div>
          <div class="text-[10px] text-slate-500 font-bold uppercase mt-1">تهديدات</div>
        </div>
        <div class="glass rounded-2xl p-5 text-center">
          <div id="sCritical" class="text-3xl font-black text-amber-400">—</div>
          <div class="text-[10px] text-slate-500 font-bold uppercase mt-1">حرجة</div>
        </div>
      </div>

      <!-- Blacklist -->
      <div class="glass rounded-2xl p-6 space-y-4">
        <h3 class="font-black flex items-center gap-2"><i data-lucide="ban" class="w-4 h-4 text-red-400"></i> القائمة السوداء</h3>
        <div class="flex gap-2">
          <input id="blDomain" placeholder="domain.com" class="flex-1 bg-slate-900 border border-slate-700 rounded-xl px-4 py-2.5 text-sm" dir="ltr" />
          <input id="blReason" placeholder="السبب" class="w-32 bg-slate-900 border border-slate-700 rounded-xl px-3 py-2.5 text-sm" />
          <button onclick="addBlack()" class="bg-red-600 hover:bg-red-500 text-white font-bold px-5 rounded-xl text-sm">إضافة</button>
        </div>
        <div id="blList" class="space-y-2 max-h-48 overflow-y-auto text-sm"></div>
      </div>

      <!-- Whitelist -->
      <div class="glass rounded-2xl p-6 space-y-4">
        <h3 class="font-black flex items-center gap-2"><i data-lucide="check-circle" class="w-4 h-4 text-emerald-400"></i> القائمة البيضاء</h3>
        <div class="flex gap-2">
          <input id="wlDomain" placeholder="trusted.com" class="flex-1 bg-slate-900 border border-slate-700 rounded-xl px-4 py-2.5 text-sm" dir="ltr" />
          <button onclick="addWhite()" class="bg-emerald-600 hover:bg-emerald-500 text-white font-bold px-5 rounded-xl text-sm">إضافة</button>
        </div>
        <div id="wlList" class="space-y-2 max-h-48 overflow-y-auto text-sm"></div>
      </div>

      <!-- Community Reports -->
      <div class="glass rounded-2xl p-6 space-y-4">
        <h3 class="font-black flex items-center gap-2"><i data-lucide="flag" class="w-4 h-4 text-amber-400"></i> بلاغات المجتمع</h3>
        <div id="reportsList" class="space-y-2 max-h-64 overflow-y-auto text-sm">
          <p class="text-slate-500 text-xs">جاري التحميل...</p>
        </div>
      </div>
    </div>
  </div>

  <script>
    let TOKEN = localStorage.getItem('sc_admin_token') || '';

    function headers() {
      return { 'Content-Type': 'application/json', 'X-Admin-Token': TOKEN };
    }

    async function login() {
      TOKEN = document.getElementById('adminToken').value.trim();
      if (!TOKEN) return;
      try {
        const res = await fetch('/api/admin/stats', { headers: headers() });
        if (!res.ok) throw new Error('غير مصرح');
        localStorage.setItem('sc_admin_token', TOKEN);
        document.getElementById('authBox').classList.add('hidden');
        document.getElementById('dashboard').classList.remove('hidden');
        loadAll();
      } catch (e) {
        document.getElementById('authError').textContent = 'التوكن غير صحيح';
        document.getElementById('authError').classList.remove('hidden');
      }
    }

    // Auto login if token stored
    if (TOKEN) {
      fetch('/api/admin/stats', { headers: headers() }).then(r => {
        if (r.ok) {
          document.getElementById('authBox').classList.add('hidden');
          document.getElementById('dashboard').classList.remove('hidden');
          loadAll();
        }
      });
    }

    async function loadAll() {
      const res = await fetch('/api/admin/stats', { headers: headers() });
      const data = await res.json();
      document.getElementById('sTotal').textContent = data.total_scans || 0;
      document.getElementById('sThreats').textContent = data.threats_detected || 0;
      document.getElementById('sCritical').textContent = data.critical_count || 0;

      const lists = data.lists || {};
      const bl = lists.blacklist || {};
      document.getElementById('blList').innerHTML = Object.keys(bl).length
        ? Object.entries(bl).map(([d, r]) =>
            '<div class="flex justify-between items-center bg-slate-900/60 rounded-xl px-4 py-2">' +
            '<div><span class="font-mono text-xs" dir="ltr">' + d + '</span> <span class="text-slate-500 text-[11px]">· ' + r + '</span></div>' +
            '<button onclick="removeBlack(\'' + d + '\')" class="text-red-400 text-xs font-bold hover:underline">حذف</button></div>'
          ).join('')
        : '<p class="text-slate-500 text-xs">فارغة</p>';

      const wl = lists.whitelist || [];
      document.getElementById('wlList').innerHTML = wl.length
        ? wl.map(d =>
            '<div class="flex justify-between items-center bg-slate-900/60 rounded-xl px-4 py-2">' +
            '<span class="font-mono text-xs" dir="ltr">' + d + '</span>' +
            '<button onclick="removeWhite(\'' + d + '\')" class="text-red-400 text-xs font-bold hover:underline">حذف</button></div>'
          ).join('')
        : '<p class="text-slate-500 text-xs">فارغة</p>';
      loadReports();
      lucide.createIcons();
    }

    async function loadReports() {
      try {
        const res = await fetch('/api/community/reports?status=pending', { headers: headers() });
        const data = await res.json();
        const items = data.reports || [];
        const el = document.getElementById('reportsList');
        if (!el) return;
        el.innerHTML = items.length ? items.map(r =>
          '<div class="bg-slate-900/60 rounded-xl px-4 py-3 space-y-2">' +
          '<div class="flex justify-between gap-2"><span class="font-mono text-xs" dir="ltr">'+(r.domain||r.url||'')+'</span>' +
          '<span class="text-[10px] text-amber-400 font-bold">'+(r.reason||'')+'</span></div>' +
          '<div class="text-[11px] text-slate-500">'+(r.details||'')+'</div>' +
          '<div class="flex gap-2">' +
          '<button onclick="modReport('+r.id+',\'approved\',true)" class="text-[11px] font-bold text-emerald-400 hover:underline">قبول + قائمة سوداء</button>' +
          '<button onclick="modReport('+r.id+',\'rejected\',false)" class="text-[11px] font-bold text-red-400 hover:underline">رفض</button>' +
          '</div></div>'
        ).join('') : '<p class="text-slate-500 text-xs">لا توجد بلاغات معلّقة</p>';
      } catch(e) {}
    }
    async function modReport(id, status, addBl) {
      await fetch('/api/community/moderate', {
        method: 'POST', headers: headers(),
        body: JSON.stringify({ id, status, add_blacklist: addBl })
      });
      loadReports();
      loadAll();
    }

    async function addBlack() {
      const domain = document.getElementById('blDomain').value.trim();
      const reason = document.getElementById('blReason').value.trim() || 'Manual';
      if (!domain) return;
      await fetch('/api/admin/blacklist', { method: 'POST', headers: headers(), body: JSON.stringify({ domain, reason }) });
      document.getElementById('blDomain').value = '';
      loadAll();
    }
    async function removeBlack(domain) {
      await fetch('/api/admin/blacklist', { method: 'DELETE', headers: headers(), body: JSON.stringify({ domain }) });
      loadAll();
    }
    async function addWhite() {
      const domain = document.getElementById('wlDomain').value.trim();
      if (!domain) return;
      await fetch('/api/admin/whitelist', { method: 'POST', headers: headers(), body: JSON.stringify({ domain }) });
      document.getElementById('wlDomain').value = '';
      loadAll();
    }
    async function removeWhite(domain) {
      await fetch('/api/admin/whitelist', { method: 'DELETE', headers: headers(), body: JSON.stringify({ domain }) });
      loadAll();
    }

    lucide.createIcons();
  </script>
</body>
</html>
